_schema-version: 3.3.0
ID: IT_Ticket
description: A simple CAP project.
version: 1.0.0
modules:
- name: IT_Ticket-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: IT_Ticket-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: IT_Ticket-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: IT_Ticket-db
  parameters:
    buildpack: nodejs_buildpack
- name: ITSupport_workflow
  type: com.sap.application.content
  path: ITSupport_workflow
  requires:
  - name: sap_processautomation
    parameters:
      content-target: true
      service-key:
        config:
          deployUsageScenario: workflow
        name: spa-workflow-service-key
- name: Support_User_Subflow
  type: com.sap.application.content
  path: Support_User_Subflow
  requires:
  - name: sap_processautomation
    parameters:
      content-target: true
      service-key:
        config:
          deployUsageScenario: workflow
        name: spa-workflow-service-key
resources:
- name: IT_Ticket-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: sap_processautomation
  type: org.cloudfoundry.managed-service
  parameters:
    service: process-automation-service
    service-plan: standard
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
